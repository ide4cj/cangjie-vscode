name: Bump

# A stable release (cjls's D32): once Renovate's PR moves .cjls-version, or by hand. `cog bump`
# from the conventional commits, its minor made even: odd minors are the pre-releases'.
on:
  push:
    branches: [master]
    paths: [.cjls-version]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      issues: write

  bump:
    name: cog bump
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      # the organization's app gets past a ruleset on master; GITHUB_TOKEN until it is installed
      - id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: cocogitto/cocogitto-action@v4
        with:
          command: check
      - id: bump
        run: |
          if [ -z "$(cat .cjls-version)" ]; then echo "::error::.cjls-version pins no cjls release"; exit 1; fi
          next=$(cog bump --auto --dry-run 2>/dev/null || true)
          if [ -z "$next" ]; then echo "::notice::nothing to release"; exit 0; fi
          IFS=. read -r major minor patch <<< "${next#v}"
          if [ $((minor % 2)) = 1 ]; then minor=$((minor + 1)); patch=0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cog bump --version "$major.$minor.$patch"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

  release:
    needs: bump
    if: needs.bump.outputs.version
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.bump.outputs.version }}
      channel: stable
    secrets: inherit
    permissions:
      contents: write
