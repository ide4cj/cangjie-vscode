name: Bump

# A stable release (cjls's D32): once Renovate's PR moves .cjls-version, or by hand. Its version is
# the pinned cjls's minor with a patch of its own (cjls's D132), when a commit since the last
# release is one `cog bump --auto` would release.
on:
  push:
    branches: [master]
    paths: [.cjls-version]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      issues: write

  bump:
    name: cog bump
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      # the organization's app gets past a ruleset on master; GITHUB_TOKEN until it is installed
      - id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: cocogitto/cocogitto-action@v4
        with:
          command: check
      - id: next
        uses: ide4cj/.github/actions/client-version@master
      - id: bump
        if: steps.next.outputs.version
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cog bump --version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: bump
    if: needs.bump.outputs.version
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.bump.outputs.version }}
      channel: stable
    secrets: inherit
    permissions:
      contents: write
