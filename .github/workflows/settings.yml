name: Settings

# The server's settings package.json declares are those of the cjls it pins (cjls's D79, D107):
# made again in the PR that moves .cjls-version, Renovate's, and pushed to it when they differ.
# No other CI checks them: a paired branch's cjls may have settings the pin has not.
on:
  pull_request:
    paths: [.cjls-version, .github/workflows/settings.yml]

permissions:
  contents: read

jobs:
  settings:
    name: The server's settings
    # the app's token, which a fork's PR does not get, pushes; Renovate's PRs are this repository's
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app.outputs.token }}
      - id: pin
        run: echo "version=$(cat .cjls-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ide4cj/.github/actions/settings@settings-follow-pin
        with:
          version: ${{ steps.pin.outputs.version }}
          run: node scripts/settings.mjs "$CJLS"
