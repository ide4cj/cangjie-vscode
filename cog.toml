ignore_merge_commits = true
ignore_fixup_commits = true

# `cog bump` on master (bump.yml): the version into package.json, the tag, then release.yml
tag_prefix = "v"
branch_whitelist = ["master"]
pre_bump_hooks = [
    "npm version {{version}} --no-git-tag-version --allow-same-version",
]
post_bump_hooks = [
    "git push",
    "git push origin v{{version}}",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "ide4cj"
repository = "cangjie-vscode"
