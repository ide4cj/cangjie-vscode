<!-- The extension's icon, drawn without fonts: `rsvg-convert -w 256 -h 256 images/icon.svg -o images/icon.png`
     (the Marketplace takes a PNG of at least 128px, never an SVG) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6f8b"/>
      <stop offset="1" stop-color="#143d59"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round">
    <!-- c -->
    <path d="M 124 104 A 40 40 0 1 0 124 164"/>
    <!-- j -->
    <path d="M 168 104 L 168 180 A 26 26 0 0 1 120 196"/>
  </g>
  <circle cx="168" cy="66" r="14" fill="#f2b134"/>
</svg>
